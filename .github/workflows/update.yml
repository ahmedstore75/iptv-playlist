name: Tapmad Playlist Auto Updater

on:
  schedule:
    - cron: '*/31 * * * *' # প্রতি ৩০ মিনিট পর পর অটোমেটিক চলবে
  workflow_dispatch: # ম্যানুয়ালি রান করার অপশন

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz

      - name: Run Auto Update Script
        run: python script.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add Tapmad_sm.m3u Tapmad_sm.json
          git commit -m "Auto update playlist and json [skip ci]" || exit 0
          git push
