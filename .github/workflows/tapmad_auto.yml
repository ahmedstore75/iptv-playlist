name: Auto Update Playlist

on:
  schedule:
    - cron: '0 */6 * * *' # প্রতি ৬ ঘণ্টা পর পর অটোমেটিক চলবে
  workflow_dispatch: # ম্যানুয়ালি চালানোর জন্য

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-python-version: '3.x'

      - name: Run Script
        run: python script.py # আপনার পাইথন স্ক্রিপ্টের নাম

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add Tapmad_sm.m3u
          git commit -m "Auto update playlist" || exit 0
          git push
